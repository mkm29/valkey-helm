# Number of Valkey and Sentinel pods to run (must be at least 3 if using sentinel mode)
replicaCount: 1

image:
  # Valkey Docker image to use
  repository: docker.io/valkey/valkey
  # Image pull policy (Always, IfNotPresent, Never)
  pullPolicy: IfNotPresent
  # Image tag (leave empty to use .Chart.AppVersion)
  tag: "9-trixie"

metrics:
  image: &metricsImage
    # Prometheus exporter Docker image
    repository: ghcr.io/oliver006/redis_exporter
    # Image pull policy (Always, IfNotPresent, Never)
    pullPolicy: IfNotPresent
    # Image tag (leave empty to use latest)
    tag: "v1.79.0"

# Secrets with credentials to pull images from a private registry
imagePullSecrets: []
# - name: myRegistryCreds

config:
  # Deployment mode, possible values: standalone, sentinel
  mode: standalone
  # Valkey logging level: debug, verbose, notice, warning
  logLevel: notice
  # Content for valkey.conf (will be mounted via ConfigMap)
  valkey: ""
  # Content for sentinel.conf (used only if mode is sentinel)
  sentinel: ""

# Network policy to control traffic to/from the Valkey pods
# Since Valkey and Sentinel run in the same pods (sidecar pattern), one policy applies to both
# More info: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy: {}

# Authentication configuration (applies to both Valkey and Sentinel)
auth:
  # Enable authentication
  # When false, authentication is completely disabled
  # When true, uses ACL-based authentication (user-based access control)
  enabled: false

  # ACL-based authentication configuration
  acl:
    # Single password for simple setup (creates both default and sentinel users with same password)
    # If set, automatically creates:
    #   - user default on ><password> ~* &* +@all -@admin -@dangerous
    #   - user sentinel on ><password> ~* &* +@read +@write +@admin +@dangerous
    password: ""

    # OR: Separate passwords for each user (advanced mode)
    # Password for the default user (application access)
    # If set, automatically creates: user default on ><password> ~* &* +@all -@admin -@dangerous
    defaultUserPassword: ""
    # Password for the sentinel user (management access)
    # If set, automatically creates: user sentinel on ><password> ~* &* +@read +@write +@admin +@dangerous
    sentinelUserPassword: ""

    # OR: Use existing secret containing ACL passwords
    # This can be a regular Kubernetes Secret or one managed by external secret managers
    # IMPORTANT: If existingSecret is set, you must also set the key names below
    existingSecret: ""
    # Key in secret for default user password (required if existingSecret is set)
    existingSecretDefaultUserKey: ""
    # Key in secret for sentinel user password (required if existingSecret is set)
    existingSecretSentinelUserKey: ""

    # OR: Full custom ACL configuration (only used if all password fields are empty)
    # If all password fields above are empty AND this is empty, ACL authentication will be disabled
    # Example:
    #   config: |
    #     user default on >changeme ~* &* +@all -@admin -@dangerous
    #     user sentinel on >sentinelpass ~* &* +@read +@write +@admin +@dangerous
    config: ""

valkey:
  # Resource limits/requests for the main Valkey container
  resources: {}
    # Example:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Resource limits/requests for init containers
  initResources: {}
    # Example:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi


  # Mount additional secrets into the Valkey container
  extraSecrets: []

  # Mount additional configMaps into the Valkey container
  extraConfigs: []

  # Metrics configuration for Valkey pods
  metrics:
    # Enable Prometheus exporter sidecar
    enabled: false
    # Exporter configuration
    exporter:
      # Command to run in the metrics exporter container (overrides args)
      command: []
      # Arguments to pass to the metrics exporter container
      args: []
        # Example:
        # - --redis.addr=redis:6379
      # Port on which the metrics exporter will listen
      port: 9121
      # Image configuration
      image:
        <<: *metricsImage
      resources: {}
        # Example:
        # limits:
        #   cpu: 100m
        #   memory: 128Mi
        # requests:
        #   cpu: 100m
        #   memory: 128Mi
      # Extra volume mounts for metrics exporter container
      extraVolumeMounts: []
      # Environment variables to inject into the metrics exporter container
      extraEnvs: {}
      # Example:
      # LOG_LEVEL: info
      securityContext: {}
        # Example:
        # runAsNonRoot: true
        # runAsUser: 1000
        # runAsGroup: 1000
        # capabilities:
        #   drop:
        #     - ALL
        # readOnlyRootFilesystem: true

    # Service configuration for the metrics exporter
    service:
      # Enable a separate service for the metrics exporter
      enabled: true
      # Service type (ClusterIP, NodePort, LoadBalancer)
      type: ClusterIP
      # Port on which the metrics exporter service will be exposed
      ports:
        http: 9121
      # Optional annotations for the metrics exporter service
      annotations: {}
      # Optional labels for the metrics exporter service
      extraLabels: {}
      # ServiceMonitor configuration for Prometheus Operator
    serviceMonitor:
      # Enable ServiceMonitor resource for scraping service metrics
      enabled: false
      # Port name or number to scrape metrics from
      port: metrics
      # Extra labels for the ServiceMonitor resource
      extraLabels: {}
      # Extra annotations for the ServiceMonitor resource
      annotations: {}
      # How often Prometheus should scrape metrics
      interval: 30s
      # Maximum duration allowed for a scrape request
      scrapeTimeout: ""
      # Relabeling rules applied before scraping metrics
      relabelings: []
      # Relabeling rules applied before ingesting metrics
      metricRelabelings: []
      # Set honorLabels to true to preserve original metric labels
      honorLabels: false
      # Extra labels to help Prometheus discover ServiceMonitor resources
      additionalLabels: {}
      # Pod labels to copy onto the generated metrics
      podTargetLabels: []
      # Maximum number of samples to collect per Pod scrape
      sampleLimit: false
      # Maximum number of scrape targets allowed
      targetLimit: false
    podMonitor:
      # Enable PodMonitor resource for scraping pod metrics
      enabled: false
      # Port name or number to scrape metrics from
      port: metrics
      # Extra labels for the PodMonitor resource
      extraLabels: {}
      # Extra annotations for the PodMonitor resource
      annotations: {}
      # Frequency for Prometheus to scrape pod metrics
      interval: 30s
      # Time limit for each scrape operation
      scrapeTimeout: ""
      # Relabeling rules to apply before scraping pod metrics
      relabelings: []
      # Relabeling rules to apply before ingesting pod metrics
      metricRelabelings: []
      # If true, keeps original labels from the pod metrics
      honorLabels: false
      # Additional labels for Prometheus to find PodMonitor resources
      additionalLabels: {}
      # Pod labels to attach to the metrics
      podTargetLabels: []
      # Maximum samples to scrape from each Pod
      sampleLimit: false
      # Maximum number of pods to scrape
      targetLimit: false

    # PrometheusRule configuration for alerting rules (used by kube-prometheus-stack)
    prometheusRule:
      # Enable creation of PrometheusRule resource
      enabled: false
      # Extra labels to add to the PrometheusRule resource
      extraLabels: {}
      # Extra annotations to add to the PrometheusRule resource
      extraAnnotations: {}
      # List of Prometheus alerting rules
      rules: []
      # Example alerting rules:
      # - alert: ValkeyDown
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} down
      #     description: Valkey instance {{ "{{ $labels.instance }}" }} is down.
      #   expr: |
      #     redis_up{service="{{ include "valkey.fullname" . }}-metrics"} == 0
      #   for: 2m
      #   labels:
      #     severity: error
      # - alert: ValkeyMemoryHigh
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} is using too much memory
      #     description: |
      #        Valkey instance {{ "{{ $labels.instance }}" }} is using {{ "{{ $value }}" }}% of its available memory.
      #   expr: |
      #      redis_memory_used_bytes{service="{{ include "valkey.fullname" . }}-metrics"} * 100
      #      /
      #      redis_memory_max_bytes{service="{{ include "valkey.fullname" . }}-metrics"}
      #      > 90 <= 100
      #   for: 2m
      #   labels:
      #     severity: error
      # - alert: ValkeyKeyEviction
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} has evicted keys
      #     description: |
      #        Valkey instance {{ "{{ $labels.instance }}" }} has evicted {{ "{{ $value }}" }} keys in the last 5 minutes.
      #   expr: |
      #     increase(redis_evicted_keys_total{service="{{ include "valkey.fullname" . }}-metrics"}[5m]) > 0
      #   for: 1s
      #   labels:
      #     severity: error

# Sentinel configuration (used only if config.mode is sentinel)
# NOTE: Sentinel runs as a sidecar container in the Valkey StatefulSet pods.
# This means:
# - Each Valkey pod includes both Valkey and Sentinel containers
# - Number of Sentinel instances = root-level replicaCount
# - Both containers share the same pod lifecycle and resources
# - Guaranteed co-location and simplified operations
sentinel:
  # Sentinel port
  port: 26379

  # Quorum: number of Sentinels that must agree primary is down
  # Recommendation: (replicaCount / 2) + 1 for majority consensus
  # Must be: 2 <= quorum <= replicaCount
  quorum: 2

  # Time before instance considered down (milliseconds)
  downAfterMilliseconds: 30000

  # Failover timeout in milliseconds
  failoverTimeout: 180000

  # Number of replicas syncing simultaneously during failover
  parallelSyncs: 1

  # Announce configuration
  announce:
    enabled: false

  # Resource limits/requests for the Sentinel container
  resources: {}
    # Example:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Mount additional secrets into the Sentinel container
  extraSecrets: []

  # Mount additional configMaps into the Sentinel container
  extraConfigs: []

  # Metrics configuration for Sentinel pods
  metrics:
    # Enable Prometheus exporter sidecar
    enabled: false
    # Exporter configuration
    exporter:
      # Command to run in the metrics exporter container (overrides args)
      command: []
      # Arguments to pass to the metrics exporter container
      args: []
        # Example:
        # - --redis.addr=redis:6379
      # Port on which the metrics exporter will listen
      port: 9122
      # Image configuration
      image:
        <<: *metricsImage
      resources: {}
        # Example:
        # limits:
        #   cpu: 100m
        #   memory: 128Mi
        # requests:
        #   cpu: 100m
        #   memory: 128Mi
      # Extra volume mounts for metrics exporter container
      extraVolumeMounts: []
      # Environment variables to inject into the metrics exporter container
      extraEnvs: {}
      # Example:
      # LOG_LEVEL: info
      securityContext: {}
        # Example:
        # runAsNonRoot: true
        # runAsUser: 1000
        # runAsGroup: 1000
        # capabilities:
        #   drop:
        #     - ALL
        # readOnlyRootFilesystem: true

    # Service configuration for the metrics exporter
    service:
      # Enable a separate service for the metrics exporter
      enabled: true
      # Service type (ClusterIP, NodePort, LoadBalancer)
      type: ClusterIP
      # Port on which the metrics exporter service will be exposed
      ports:
        http: 9122
      # Optional annotations for the metrics exporter service
      annotations: {}
      # Optional labels for the metrics exporter service
      extraLabels: {}
      # ServiceMonitor configuration for Prometheus Operator
    serviceMonitor:
      # Enable ServiceMonitor resource for scraping service metrics
      enabled: false
      # Port name or number to scrape metrics from
      port: metrics
      # Extra labels for the ServiceMonitor resource
      extraLabels: {}
      # Extra annotations for the ServiceMonitor resource
      annotations: {}
      # How often Prometheus should scrape metrics
      interval: 30s
      # Maximum duration allowed for a scrape request
      scrapeTimeout: ""
      # Relabeling rules applied before scraping metrics
      relabelings: []
      # Relabeling rules applied before ingesting metrics
      metricRelabelings: []
      # Set honorLabels to true to preserve original metric labels
      honorLabels: false
      # Extra labels to help Prometheus discover ServiceMonitor resources
      additionalLabels: {}
      # Pod labels to copy onto the generated metrics
      podTargetLabels: []
      # Maximum number of samples to collect per Pod scrape
      sampleLimit: false
      # Maximum number of scrape targets allowed
      targetLimit: false
    podMonitor:
      # Enable PodMonitor resource for scraping pod metrics
      enabled: false
      # Port name or number to scrape metrics from
      port: metrics
      # Extra labels for the PodMonitor resource
      extraLabels: {}
      # Extra annotations for the PodMonitor resource
      annotations: {}
      # Frequency for Prometheus to scrape pod metrics
      interval: 30s
      # Time limit for each scrape operation
      scrapeTimeout: ""
      # Relabeling rules to apply before scraping pod metrics
      relabelings: []
      # Relabeling rules to apply before ingesting pod metrics
      metricRelabelings: []
      # If true, keeps original labels from the pod metrics
      honorLabels: false
      # Additional labels for Prometheus to find PodMonitor resources
      additionalLabels: {}
      # Pod labels to attach to the metrics
      podTargetLabels: []
      # Maximum samples to scrape from each Pod
      sampleLimit: false
      # Maximum number of pods to scrape
      targetLimit: false

    # PrometheusRule configuration for alerting rules (used by kube-prometheus-stack)
    prometheusRule:
      # Enable creation of PrometheusRule resource
      enabled: false
      # Extra labels to add to the PrometheusRule resource
      extraLabels: {}
      # Extra annotations to add to the PrometheusRule resource
      extraAnnotations: {}
      # List of Prometheus alerting rules
      rules: []
      # Example alerting rules:
      # - alert: ValkeyDown
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} down
      #     description: Valkey instance {{ "{{ $labels.instance }}" }} is down.
      #   expr: |
      #     redis_up{service="{{ include "valkey.fullname" . }}-metrics"} == 0
      #   for: 2m
      #   labels:
      #     severity: error
      # - alert: ValkeyMemoryHigh
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} is using too much memory
      #     description: |
      #        Valkey instance {{ "{{ $labels.instance }}" }} is using {{ "{{ $value }}" }}% of its available memory.
      #   expr: |
      #      redis_memory_used_bytes{service="{{ include "valkey.fullname" . }}-metrics"} * 100
      #      /
      #      redis_memory_max_bytes{service="{{ include "valkey.fullname" . }}-metrics"}
      #      > 90 <= 100
      #   for: 2m
      #   labels:
      #     severity: error
      # - alert: ValkeyKeyEviction
      #   annotations:
      #     summary: Valkey instance {{ "{{ $labels.instance }}" }} has evicted keys
      #     description: |
      #        Valkey instance {{ "{{ $labels.instance }}" }} has evicted {{ "{{ $value }}" }} keys in the last 5 minutes.
      #   expr: |
      #     increase(redis_evicted_keys_total{service="{{ include "valkey.fullname" . }}-metrics"}[5m]) > 0
      #   for: 1s
      #   labels:
      #     severity: error

# Override the default name or full name of resources
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a service account for Valkey
  create: true
  # Whether to automount the service account token
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # Name of an existing service account to use (if create: false)
  name: ""

# Annotations and labels for the pods
podAnnotations: {}
podLabels: {}

# Security context for the pod (applies to all containers)
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  runAsUser: 1000
  runAsGroup: 1000

# Security context for the Valkey containers
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Security context for init containers (cannot use readOnlyRootFilesystem since they write configs)
initSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  # Enable the ClusterIP service for load-balanced client connections
  # A headless service is always created for StatefulSet DNS (this setting does not affect it)
  enabled: true
  # Type of Kubernetes service (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Port on which Valkey will be exposed
  port: 6379
  annotations: {}
  # NodePort value (if service.type is NodePort)
  nodePort: 0

# Persistent storage configuration for Valkey data
# NOTE: Only applies to Valkey pods, not Sentinel pods
dataStorage:
  # Enable persistent volume claim creation
  enabled: false
  # Storage size (e.g., 8Gi for production workloads)
  requestedSize: ""
  # Storage class name (leave empty for default)
  className: ""
  # Access modes for the PVC
  accessModes:
    - ReadWriteOnce
  # Optional annotations to add to the PVC
  annotations: {}
  # Optional labels to add to the PVC
  labels: {}
  # Volume name to use for mounting data
  volumeName: "data"
  # Optional subPath for the volume mount
  subPath: ""
  # Use an existing PVC instead of creating a new one
  persistentVolumeClaimName: ""
  # Keep PVC when uninstalling (adds helm.sh/resource-policy: keep annotation)
  keepPvc: false

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment to tainted nodes
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Set Deployment strategy. See https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
deploymentStrategy: RollingUpdate

# See https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints
topologySpreadConstraints: []

# Additional init containers to run before Valkey starts
extraInitContainers: []
  # Example:
  # - name: custom-init
  #   image: busybox
  #   command: ['sh', '-c', 'echo "Custom init"']

# Environment variables to inject into Valkey container
env: {}
  # Example:
  # LOG_LEVEL: info